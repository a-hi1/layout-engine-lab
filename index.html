<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>布局引擎实验台 · 分层图自动布局</title>
<meta name="description" content="纯前端零依赖的流程图画布：拖动、框选、成组，一键把缠绕的连线排成清晰的分层结构，连线交叉与节点重叠实时可见。" />
<style>
  :root{
    --paper:#f7f5f1; --paper-2:#efece6; --card:#ffffff;
    --ink:#17181c; --ink-2:#4c4a45; --ink-3:#8d8a82; --ink-4:#b6b1a7;
    --line:#e2ddd4; --line-2:#cec7ba;
    --accent:#d0482a; --accent-s:#fbe9e4;
    --sans:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
    --serif:"Songti SC","STSong","SimSun",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  canvas{display:block;position:absolute;inset:0;touch-action:none}
  canvas.panning{cursor:grabbing}
  canvas.selecting{cursor:crosshair}

  /* 左上标题 */
  .brand{position:fixed;top:30px;left:34px;z-index:10;pointer-events:none}
  .brand .k{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
  .brand h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-top:8px;line-height:1.2}
  .brand p{font-size:11.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.02em}

  /* 右上指标 */
  .metrics{position:fixed;top:28px;right:34px;z-index:10;text-align:right}
  .mrow{display:flex;align-items:baseline;justify-content:flex-end;gap:11px;margin-bottom:9px}
  .mrow .l{font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;font-family:var(--mono)}
  .mrow .v{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1;letter-spacing:-.03em;
           font-variant-numeric:tabular-nums;transition:color .3s}
  .mrow .v.hot{color:var(--accent)}
  .mrow .v.cool{color:#2f7d5e}
  .delta{font-family:var(--mono);font-size:10.5px;color:var(--accent);opacity:0;transition:opacity .3s;font-weight:600}
  .delta.on{opacity:1}
  .rule{height:1px;background:var(--line);margin:14px 0 12px}
  .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);letter-spacing:.08em}

  /* 底部工具条 */
  .dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;
        display:flex;align-items:center;gap:4px;padding:6px;
        background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 30px -18px rgba(60,45,30,.5)}
  button{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);background:transparent;border:0;
         border-radius:999px;padding:8px 14px;cursor:pointer;transition:.16s;white-space:nowrap}
  button:hover{background:var(--paper-2);color:var(--ink)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.3;cursor:default}
  button:disabled:hover{background:transparent;color:var(--ink-2)}
  button.primary{background:var(--ink);color:#fbfaf8;font-weight:600}
  button.primary:hover{background:#000}
  .div{width:1px;height:18px;background:var(--line);margin:0 4px}
  .mode{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-4);padding:0 10px 0 6px;white-space:nowrap;text-transform:uppercase}
  .mode b{color:var(--accent);font-weight:700}

  /* 提示 */
  .hint{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:9;
        font-size:11.5px;color:var(--ink-3);pointer-events:none;transition:opacity .5s;letter-spacing:.02em}
  .hint kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line-2);border-radius:4px;
            padding:1px 5px;color:var(--ink-2);background:#fff}
  .hint.gone{opacity:0}

  /* 左下手记 */
  .note{position:fixed;left:34px;bottom:28px;z-index:10;max-width:308px;
        font-size:10.5px;line-height:1.8;color:var(--ink-3)}
  .note b{color:var(--ink-2);font-weight:600}
  .note .t{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
           color:var(--accent);border:1px solid #f0cdc5;background:var(--accent-s);
           border-radius:3px;padding:1px 6px;margin-bottom:8px;text-transform:uppercase}

  @media (max-width:900px){
    .note{display:none}
    .brand{top:18px;left:18px}
    .brand h1{font-size:18px}
    .brand p{display:none}
    .metrics{top:16px;right:18px}
    .mrow .v{font-size:19px}
    .mrow .l{display:none}
    .dock{bottom:14px;left:14px;right:14px;transform:none;flex-wrap:wrap;justify-content:center}
    .hint{bottom:150px;width:100%;left:0;transform:none;text-align:center;padding:0 18px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="brand">
  <div class="k">Layout Engine</div>
  <h1>布局引擎实验台</h1>
  <p>分层图自动布局 · 拖动试试</p>
</div>

<div class="metrics">
  <div class="mrow"><span class="l">Crossings</span><span class="v hot" id="mCross">0</span><span class="delta" id="dCross"></span></div>
  <div class="mrow"><span class="l">Overlap</span><span class="v hot" id="mOverlap">0</span><span class="delta" id="dOverlap"></span></div>
  <div class="rule"></div>
  <div class="cnt" id="mCount">0 / 0</div>
</div>

<div class="hint" id="hint">随手拖乱它 · 然后点 <kbd>自动布局</kbd> 看交叉数掉下来</div>

<div class="dock">
  <button class="primary" id="btnLayout">自动布局</button>
  <button id="btnShuffle">打乱</button>
  <div class="div"></div>
  <button id="btnGroup">成组</button>
  <button id="btnUngroup">解散</button>
  <div class="div"></div>
  <button id="btnUndo">撤销</button>
  <button id="btnRedo">重做</button>
  <div class="div"></div>
  <button id="btnFit">适应窗口</button>
  <span class="mode">模式 <b id="mMode">移动</b></span>
</div>

<div class="note">
  <span class="t">Algorithm</span><br />
  <b>分层（最长路径）+ barycenter 迭代 + 相邻交换优化</b>。
  先把节点按依赖分层，再反复用「相邻层邻居位置的平均值」排序，
  最后做一轮局部交换把交叉压下去。
  <br /><br />
  节点位置被打乱，<b>图的结构从头到尾没变过</b>。
</div>

<script>
(function(){
  "use strict";
  var cvs=document.getElementById("stage"), ctx=cvs.getContext("2d");
  var DPR=1,W=0,H=0;

  var KINDS={
    entry:{c:"#3f6f9e"}, trade:{c:"#a9741f"}, risk:{c:"#8a5a8a"},
    billing:{c:"#3f7d5e"}, ship:{c:"#6c5ea8"}, data:{c:"#4a6b7a"}
  };
  var NODES=[
    ["首页","entry"],["搜索","entry"],["商品页","entry"],
    ["购物车","trade"],["下单","trade"],["优惠","trade"],
    ["库存","risk"],["定价","risk"],["风控","risk"],
    ["支付网关","billing"],["对账","billing"],["退款","billing"],
    ["仓储","ship"],["配送","ship"],["结算","ship"],
    ["售后","data"],["报表","data"],["监控","data"]
  ];
  var EDGES=[
    ["首页","购物车"],["搜索","购物车"],["商品页","下单"],["商品页","优惠"],["购物车","下单"],
    ["购物车","库存"],["下单","定价"],["优惠","定价"],["下单","风控"],["购物车","风控"],
    ["库存","支付网关"],["定价","支付网关"],["风控","支付网关"],["风控","对账"],["定价","退款"],
    ["支付网关","仓储"],["支付网关","配送"],["对账","结算"],["退款","结算"],
    ["仓储","报表"],["配送","监控"],["结算","售后"],
    ["搜索","下单"],["首页","优惠"],["购物车","定价"],["优惠","库存"],["下单","库存"],
    ["库存","对账"],["风控","退款"],["支付网关","结算"],["退款","配送"],["对账","仓储"],
    ["仓储","监控"],["结算","报表"]
  ];
  var NW=140,NH=46,COLG=212,ROWG=78;

  var S={nodes:[],edges:[],groups:[],sel:{},view:{x:0,y:0,k:1},mode:"move",hover:null,drag:null,anim:null,done:false};
  var hist=[],redo=[],_seed=1;

  function clamp(v,a,b){return v<a?a:(v>b?b:v)}
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
  function byId(id){for(var i=0;i<S.nodes.length;i++)if(S.nodes[i].id===id)return S.nodes[i];return null}
  function selN(){var n=0;for(var k in S.sel)if(S.sel[k])n++;return n}
  function rc(){_seed=(_seed*1664525+1013904223)%4294967296;return _seed/4294967296}

  function build(){
    S.nodes=[];S.edges=[];
    for(var i=0;i<NODES.length;i++)S.nodes.push({id:i,label:NODES[i][0],kind:NODES[i][1],x:0,y:0});
    var idx={};for(i=0;i<S.nodes.length;i++)idx[S.nodes[i].label]=i;
    for(i=0;i<EDGES.length;i++){
      var a=idx[EDGES[i][0]],b=idx[EDGES[i][1]];
      if(a!==undefined&&b!==undefined)S.edges.push({from:a,to:b});
    }
    S.sel={};S.groups=[];S.done=false;
  }

  function layers(){
    var L={},i;for(i=0;i<S.nodes.length;i++)L[S.nodes[i].id]=0;
    var g=0,ch=true,cap=S.nodes.length;
    while(ch&&g<cap){ch=false;g++;
      for(i=0;i<S.edges.length;i++){var e=S.edges[i];
        if(L[e.to]<L[e.from]+1&&L[e.from]<cap){L[e.to]=L[e.from]+1;ch=true}}}
    return L;
  }
  function adj(){
    var m={},i;for(i=0;i<S.nodes.length;i++)m[S.nodes[i].id]={pre:[],nxt:[]};
    for(i=0;i<S.edges.length;i++){m[S.edges[i].from].nxt.push(S.edges[i].to);m[S.edges[i].to].pre.push(S.edges[i].from)}
    return m;
  }
  function segX(p1,p2,p3,p4){
    function d(a,b,c){return (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}
    var d1=d(p3,p4,p1),d2=d(p3,p4,p2),d3=d(p1,p2,p3),d4=d(p1,p2,p4);
    return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
  }
  function crossingsFor(t){
    var segs=[],i,e;
    for(i=0;i<S.edges.length;i++){e=S.edges[i];var p1=t[e.from],p2=t[e.to];if(p1&&p2)segs.push([p1,p2])}
    var c=0;
    for(var x=0;x<segs.length;x++)for(var y=x+1;y<segs.length;y++){
      var a1=segs[x][0],a2=segs[x][1],b1=segs[y][0],b2=segs[y][1];
      if(a1===b1||a1===b2||a2===b1||a2===b2)continue;
      if(segX(a1,a2,b1,b2))c++;
    }
    return c;
  }
  function assign(cols){
    var t={},i,c;
    for(c=0;c<cols.length;c++){
      var n=cols[c].length;
      for(var k=0;k<n;k++)t[cols[c][k]]={x:(c-(cols.length-1)/2)*COLG,y:(k-(n-1)/2)*ROWG};
    }
    return t;
  }
  function computeLayout(){
    var L=layers(),maxL=0,id;
    for(id in L)if(L[id]>maxL)maxL=L[id];
    var cols=[],i;
    for(i=0;i<=maxL;i++)cols.push([]);
    for(i=0;i<S.nodes.length;i++)cols[L[S.nodes[i].id]].push(S.nodes[i].id);
    for(i=0;i<cols.length;i++)cols[i].sort(function(a,b){return byId(a).y-byId(b).y});

    var nb=adj(),row={};
    function sync(){for(var c=0;c<cols.length;c++)for(var r=0;r<cols[c].length;r++)row[cols[c][r]]=r}
    sync();
    function bary(nid,usePrev){
      var list=usePrev?nb[nid].pre:nb[nid].nxt;
      if(!list.length)return row[nid];
      var s=0,n=0;
      for(var k=0;k<list.length;k++)if(row[list[k]]!==undefined){s+=row[list[k]];n++}
      return n?s/n:row[nid];
    }
    for(var sweep=0;sweep<5;sweep++){
      var down=(sweep%2===0),range=[],c;
      if(down){for(c=1;c<=maxL;c++)range.push(c)}
      else{for(c=maxL-1;c>=0;c--)range.push(c)}
      for(var ri=0;ri<range.length;ri++){
        c=range[ri];
        var col=cols[c].slice();
        col.sort(function(a,b){var ba=bary(a,down),bb=bary(b,down);
          if(Math.abs(ba-bb)>1e-6)return ba-bb;return row[a]-row[b]});
        cols[c]=col;
        for(var r2=0;r2<col.length;r2++)row[col[r2]]=r2;
      }
    }
    var target=assign(cols),best=crossingsFor(target);
    for(var pass=0;pass<4&&best>0;pass++){
      var imp=false;
      for(var cc=0;cc<cols.length;cc++){
        var cl=cols[cc];
        for(var j=0;j<cl.length-1;j++){
          var tmp=cl[j];cl[j]=cl[j+1];cl[j+1]=tmp;
          var t2=assign(cols),cn=crossingsFor(t2);
          if(cn<best){best=cn;target=t2;imp=true}
          else{var t3=cl[j];cl[j]=cl[j+1];cl[j+1]=t3}
        }
      }
      if(!imp)break;
    }
    return target;
  }

  function countOverlaps(){
    var c=0;
    for(var i=0;i<S.nodes.length;i++)for(var j=i+1;j<S.nodes.length;j++){
      var a=S.nodes[i],b=S.nodes[j];
      if(Math.abs(a.x-b.x)<NW*0.92&&Math.abs(a.y-b.y)<NH*0.92)c++;
    }
    return c;
  }
  function computeMetrics(){
    var segs=[],i,e;
    for(i=0;i<S.edges.length;i++){e=S.edges[i];var a=byId(e.from),b=byId(e.to);if(a&&b)segs.push([a,b])}
    var c=0;
    for(var x=0;x<segs.length;x++)for(var y=x+1;y<segs.length;y++){
      var a1=segs[x][0],a2=segs[x][1],b1=segs[y][0],b2=segs[y][1];
      if(a1===b1||a1===b2||a2===b1||a2===b2)continue;
      if(segX(a1,a2,b1,b2))c++;
    }
    return {cross:c,overlap:countOverlaps()};
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cvs.width=Math.floor(W*DPR);cvs.height=Math.floor(H*DPR);
    cvs.style.width=W+"px";cvs.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);draw();
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }

  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle="#f7f5f1";ctx.fillRect(0,0,W,H);

    var k=S.view.k,step=42*k;
    if(step>9){
      ctx.fillStyle="rgba(120,108,92,.16)";
      var ox=((S.view.x%step)+step)%step, oy=((S.view.y%step)+step)%step;
      for(var px=ox;px<W;px+=step)for(var py=oy;py<H;py+=step)ctx.fillRect(px,py,1.4,1.4);
    }

    ctx.save();
    ctx.translate(S.view.x,S.view.y);ctx.scale(k,k);

    var i;
    for(i=0;i<S.groups.length;i++){
      var bb=gbox(S.groups[i]);if(!bb)continue;
      ctx.setLineDash([7,6]);ctx.lineWidth=1.4/k;
      ctx.strokeStyle="rgba(208,72,42,.5)";
      rr(bb.x-18,bb.y-18,bb.w+36,bb.h+36,14);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="rgba(208,72,42,.045)";
      rr(bb.x-18,bb.y-18,bb.w+36,bb.h+36,14);ctx.fill();
    }

    for(i=0;i<S.edges.length;i++){
      var e=S.edges[i],a=byId(e.from),b=byId(e.to);
      if(!a||!b)continue;
      var act=!!(S.sel[a.id]||S.sel[b.id]);
      var dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
      var ux=dx/dist,uy=dy/dist;
      var ax=a.x+ux*(NW/2)*0.94, ay=a.y+uy*(NH/2)*0.94;
      var bx=b.x-ux*(NW/2)*0.94, by=b.y-uy*(NH/2)*0.94;
      var mx=(ax+bx)/2,my=(ay+by)/2,off=Math.min(64,dist*0.18);
      var cx=mx-uy*off, cy=my+ux*off;

      ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(cx,cy,bx,by);
      ctx.lineWidth=(act?1.9:1.1)/Math.max(k*0.8,.8);
      ctx.strokeStyle=act?"rgba(208,72,42,.9)":"rgba(140,130,116,.42)";
      ctx.stroke();

      var ang=Math.atan2(by-cy,bx-cx),s=5;
      ctx.beginPath();ctx.moveTo(bx,by);
      ctx.lineTo(bx-s*Math.cos(ang-0.44),by-s*Math.sin(ang-0.44));
      ctx.lineTo(bx-s*Math.cos(ang+0.44),by-s*Math.sin(ang+0.44));
      ctx.closePath();
      ctx.fillStyle=act?"rgba(208,72,42,.95)":"rgba(140,130,116,.55)";
      ctx.fill();
    }

    for(i=0;i<S.nodes.length;i++)drawNode(S.nodes[i],k);

    if(S.drag&&S.drag.type==="box"){
      var r=nrect(S.drag.x0,S.drag.y0,S.drag.x1,S.drag.y1);
      ctx.fillStyle="rgba(208,72,42,.07)";ctx.fillRect(r.x,r.y,r.w,r.h);
      ctx.strokeStyle="rgba(208,72,42,.55)";ctx.lineWidth=1.2/k;
      ctx.setLineDash([5,4]);ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawNode(n,k){
    var sel=!!S.sel[n.id], hov=(S.hover===n.id);
    var x=n.x-NW/2,y=n.y-NH/2,kind=KINDS[n.kind]||KINDS.entry;

    ctx.save();
    if(sel){ctx.shadowColor="rgba(208,72,42,.30)";ctx.shadowBlur=18/Math.max(k,.6)}
    else if(hov){ctx.shadowColor="rgba(90,75,55,.16)";ctx.shadowBlur=12/Math.max(k,.6)}

    rr(x,y,NW,NH,8);
    ctx.fillStyle="#ffffff";ctx.fill();
    ctx.shadowBlur=0;

    ctx.lineWidth=(sel?2:1.1)/Math.max(k*.8,.8);
    ctx.strokeStyle=sel?"#d0482a":(hov?"#b3aa9b":"#ddd6cb");
    rr(x,y,NW,NH,8);ctx.stroke();

    // 左侧色条
    ctx.save();
    rr(x,y,NW,NH,8);ctx.clip();
    ctx.fillStyle=kind.c;ctx.globalAlpha=sel?1:.85;
    ctx.fillRect(x,y,3.4,NH);
    ctx.restore();

    ctx.textBaseline="middle";
    ctx.font="600 13px "+getComputedStyle(document.body).fontFamily;
    ctx.fillStyle="#17181c";
    ctx.fillText(n.label,x+16,y-NH/2+16);

    ctx.font="9.5px ui-monospace,Menlo,Consolas,monospace";
    ctx.fillStyle="rgba(120,110,96,.75)";
    ctx.fillText(kindName(n.kind),x+16,y+NH/2-13);

    ctx.restore();
  }
  function kindName(k){
    return {entry:"ENTRY",trade:"TRADE",risk:"CHECK",billing:"BILLING",ship:"FULFILL",data:"DATA"}[k]||"";
  }

  function nrect(x0,y0,x1,y1){return {x:Math.min(x0,x1),y:Math.min(y0,y1),w:Math.abs(x1-x0),h:Math.abs(y1-y0)}}
  function gbox(g){
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,n=0;
    for(var i=0;i<g.length;i++){var d=byId(g[i]);if(!d)continue;n++;
      minX=Math.min(minX,d.x-NW/2);minY=Math.min(minY,d.y-NH/2);
      maxX=Math.max(maxX,d.x+NW/2);maxY=Math.max(maxY,d.y+NH/2)}
    return n?{x:minX,y:minY,w:maxX-minX,h:maxY-minY}:null;
  }
  function toWorld(cx,cy){return {x:(cx-S.view.x)/S.view.k,y:(cy-S.view.y)/S.view.k}}
  function hit(p){
    for(var i=S.nodes.length-1;i>=0;i--){var n=S.nodes[i];
      if(Math.abs(p.x-n.x)<=NW/2&&Math.abs(p.y-n.y)<=NH/2)return n}
    return null;
  }

  function snap(){
    var pos={};for(var i=0;i<S.nodes.length;i++)pos[S.nodes[i].id]={x:S.nodes[i].x,y:S.nodes[i].y};
    return {pos:pos,groups:S.groups.map(function(g){return g.slice()})};
  }
  function push(){hist.push(snap());if(hist.length>60)hist.shift();redo.length=0;btns()}
  function apply(s){
    for(var id in s.pos){var n=byId(Number(id));if(n){n.x=s.pos[id].x;n.y=s.pos[id].y}}
    S.groups=s.groups.map(function(g){return g.slice()});S.anim=null;draw();metrics(false);
  }
  function undo(){if(!hist.length)return;redo.push(snap());apply(hist.pop());btns()}
  function redoFn(){if(!redo.length)return;hist.push(snap());apply(redo.pop());btns()}

  function animateTo(target,ms){
    var from={},maxD=0;
    for(var id in target){var n=byId(Number(id));if(!n)continue;
      from[id]={x:n.x,y:n.y};
      var d=Math.hypot(target[id].x-n.x,target[id].y-n.y);if(d>maxD)maxD=d}
    S.anim={from:from,to:target,t0:performance.now(),dur:Math.max(320,Math.min(ms||860,400+maxD*1.2))};
    S.anim.timer=setTimeout(finish,S.anim.dur+90);
    requestAnimationFrame(step);
  }
  function finish(){
    var a=S.anim;if(!a)return;
    if(a.timer)clearTimeout(a.timer);
    for(var id in a.to){var n=byId(Number(id));if(n){n.x=a.to[id].x;n.y=a.to[id].y}}
    S.anim=null;metrics(true);fit(true);
  }
  function step(now){
    var a=S.anim;if(!a)return;
    var t=clamp((now-a.t0)/a.dur,0,1),e=ease(t);
    for(var id in a.to){var n=byId(Number(id));if(!n)continue;
      var f=a.from[id];n.x=f.x+(a.to[id].x-f.x)*e;n.y=f.y+(a.to[id].y-f.y)*e}
    draw();
    if(t<1)requestAnimationFrame(step);else finish();
  }

  var last={cross:0,overlap:0};
  function metrics(delta){
    var m=computeMetrics();
    var ec=document.getElementById("mCross"),eo=document.getElementById("mOverlap");
    var dc=document.getElementById("dCross"),dobj=document.getElementById("dOverlap");
    ec.textContent=m.cross;eo.textContent=m.overlap;
    ec.className="v "+(m.cross>12?"hot":"cool");
    eo.className="v "+(m.overlap>0?"hot":"cool");
    if(delta){
      if(last.cross!==m.cross){dc.textContent=(m.cross-last.cross>0?"+":"")+(m.cross-last.cross);
        dc.classList.add("on");setTimeout(function(){dc.classList.remove("on")},2800)}
      if(last.overlap!==m.overlap){dobj.textContent=(m.overlap-last.overlap>0?"+":"")+(m.overlap-last.overlap);
        dobj.classList.add("on");setTimeout(function(){dobj.classList.remove("on")},2800)}
    }
    last=m;
  }

  function fit(anim){
    if(!S.nodes.length)return;
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    for(var i=0;i<S.nodes.length;i++){var n=S.nodes[i];
      minX=Math.min(minX,n.x-NW/2);minY=Math.min(minY,n.y-NH/2);
      maxX=Math.max(maxX,n.x+NW/2);maxY=Math.max(maxY,n.y+NH/2)}
    var padX=96,padY=118;
    var k=Math.min((W-padX*2)/Math.max(maxX-minX,1),(H-padY*2)/Math.max(maxY-minY,1));
    k=clamp(k,.26,1);
    var vx=W/2-((minX+maxX)/2)*k, vy=H/2-((minY+maxY)/2)*k;
    if(anim)viewTo(vx,vy,k);else{S.view={x:vx,y:vy,k:k};draw()}
  }
  function viewTo(tx,ty,tk){
    var v0={x:S.view.x,y:S.view.y,k:S.view.k},t0=performance.now(),dur=560,done=false;
    clearTimeout(window.__vt);
    function end(){
      if(done)return;done=true;
      S.view.x=tx;S.view.y=ty;S.view.k=tk;draw();
    }
    window.__vt=setTimeout(end,dur+80);
    (function st(now){
      if(done)return;
      var t=clamp((now-t0)/dur,0,1),e=ease(t);
      S.view.x=v0.x+(tx-v0.x)*e;S.view.y=v0.y+(ty-v0.y)*e;S.view.k=v0.k+(tk-v0.k)*e;
      draw();
      if(t<1)requestAnimationFrame(st);else end();
    })(performance.now());
  }

  function scramble(spread,seed){
    var s=spread||1;
    _seed=(seed===undefined?Date.now():seed)%4294967296;
    var L=layers(),by={},i,n;
    for(i=0;i<S.nodes.length;i++){n=S.nodes[i];if(!by[L[n.id]])by[L[n.id]]=[];by[L[n.id]].push(n)}
    for(var key in by){
      var col=by[key].slice().sort(function(a,b){return a.y-b.y});
      var ys=col.map(function(x){return x.y}).reverse();
      for(i=0;i<col.length;i++)col[i].y=ys[i];
    }
    for(i=0;i<S.nodes.length;i++){
      n=S.nodes[i];
      n.x=n.x*0.52+(rc()-0.5)*255*s;
      n.y=n.y*0.95+(rc()-0.5)*168*s;
    }
    for(i=0;i<S.nodes.length;i++){
      n=S.nodes[i];
      for(var j=0;j<S.nodes.length;j++){
        if(i===j)continue;
        var m=S.nodes[j],dx=n.x-m.x,dy=n.y-m.y,minX=NW*0.62,minY=NH*0.95;
        if(Math.abs(dx)<minX&&Math.abs(dy)<minY){
          n.x+=(dx>=0?1:-1)*(minX-Math.abs(dx))*0.2;
          n.y+=(dy>=0?1:-1)*(minY-Math.abs(dy))*0.2;
        }
      }
    }
    S.done=false;S.sel={};S.groups=[];
  }

  cvs.addEventListener("pointerdown",function(ev){
    if(ev.button===1)return;
    cvs.setPointerCapture(ev.pointerId);
    var p=toWorld(ev.clientX,ev.clientY),node=hit(p);
    if(node){
      if(ev.ctrlKey||ev.metaKey)S.sel[node.id]=!S.sel[node.id];
      else if(!S.sel[node.id]){S.sel={};S.sel[node.id]=true}
      var moved={},gid=groupOf(node.id);
      if(gid!==-1)for(var i=0;i<S.groups[gid].length;i++)moved[S.groups[gid][i]]=true;
      for(var k in S.sel)moved[k]=true;
      S.drag={type:"node",start:p,origin:{},pushed:false};
      for(var id in moved){var nd=byId(Number(id));if(nd)S.drag.origin[id]={x:nd.x,y:nd.y}}
      draw();
    }else{
      if(S.mode==="select"||ev.altKey){
        S.drag={type:"box",x0:p.x,y0:p.y,x1:p.x,y1:p.y,add:ev.ctrlKey||ev.metaKey};
        cvs.classList.add("selecting");
      }else{
        S.drag={type:"pan",sx:ev.clientX,sy:ev.clientY,vx:S.view.x,vy:S.view.y};
        cvs.classList.add("panning");
      }
    }
    hideHint();
  });

  cvs.addEventListener("pointermove",function(ev){
    var p=toWorld(ev.clientX,ev.clientY),d=S.drag;
    if(!d){var h=hit(p),hh=h?h.id:null;if(hh!==S.hover){S.hover=hh;draw()}return}
    if(d.type==="pan"){S.view.x=d.vx+(ev.clientX-d.sx);S.view.y=d.vy+(ev.clientY-d.sy);draw()}
    else if(d.type==="box"){d.x1=p.x;d.y1=p.y;draw()}
    else if(d.type==="node"){
      if(!d.pushed){push();d.pushed=true}
      var dx=p.x-d.start.x,dy=p.y-d.start.y;
      for(var id in d.origin){var n=byId(Number(id));if(!n)continue;n.x=d.origin[id].x+dx;n.y=d.origin[id].y+dy}
      S.done=false;draw();
    }
  });

  function endDrag(){
    var d=S.drag;if(!d)return;
    cvs.classList.remove("selecting","panning");
    if(d.type==="box"){
      var r=nrect(d.x0,d.y0,d.x1,d.y1);
      if(!d.add)S.sel={};
      for(var i=0;i<S.nodes.length;i++){var n=S.nodes[i];
        if(n.x+NW/2>r.x&&n.x-NW/2<r.x+r.w&&n.y+NH/2>r.y&&n.y-NH/2<r.y+r.h)S.sel[n.id]=true}
      metrics(false);
    }
    S.drag=null;btns();draw();
  }
  cvs.addEventListener("pointerup",endDrag);
  cvs.addEventListener("pointercancel",endDrag);

  cvs.addEventListener("wheel",function(ev){
    ev.preventDefault();
    var k0=S.view.k,k1=clamp(k0*Math.exp(-ev.deltaY*0.0015),.2,3.4);
    var wx=(ev.clientX-S.view.x)/k0,wy=(ev.clientY-S.view.y)/k0;
    S.view.k=k1;S.view.x=ev.clientX-wx*k1;S.view.y=ev.clientY-wy*k1;draw();
  },{passive:false});

  function groupOf(id){for(var i=0;i<S.groups.length;i++)if(S.groups[i].indexOf(Number(id))!==-1)return i;return -1}
  function makeGroup(){
    var ids=[];for(var k in S.sel)if(S.sel[k])ids.push(Number(k));
    if(ids.length<2)return;
    var keep=[];
    for(var i=0;i<S.groups.length;i++){
      var g=S.groups[i].filter(function(x){return ids.indexOf(x)===-1});
      if(g.length>=2)keep.push(g);
    }
    keep.push(ids);S.groups=keep;push();draw();btns();
  }
  function ungroup(){
    var ids=[];for(var k in S.sel)if(S.sel[k])ids.push(Number(k));
    S.groups=S.groups.filter(function(g){
      for(var i=0;i<g.length;i++)if(ids.indexOf(g[i])!==-1)return false;return true});
    if(!ids.length)S.groups=[];
    push();draw();btns();
  }
  function btns(){
    document.getElementById("btnUndo").disabled=!hist.length;
    document.getElementById("btnRedo").disabled=!redo.length;
    document.getElementById("btnGroup").disabled=selN()<2;
    document.getElementById("btnUngroup").disabled=!S.groups.length;
    document.getElementById("mMode").textContent=S.mode==="move"?"移动":"选择";
  }
  function hideHint(){var h=document.getElementById("hint");if(h)h.classList.add("gone")}

  document.getElementById("btnLayout").onclick=function(){
    push();var t=computeLayout();S.done=true;animateTo(t,880);hideHint();
    document.getElementById("btnShuffle").textContent="再乱一点";
  };
  document.getElementById("btnShuffle").onclick=function(){
    push();S.anim=null;scramble(1);fit(true);metrics(false);draw();btns();
  };
  document.getElementById("btnGroup").onclick=makeGroup;
  document.getElementById("btnUngroup").onclick=ungroup;
  document.getElementById("btnUndo").onclick=undo;
  document.getElementById("btnRedo").onclick=redoFn;
  document.getElementById("btnFit").onclick=function(){fit(true)};

  window.addEventListener("keydown",function(ev){
    var tag=(ev.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea")return;
    if(ev.code==="Space"){ev.preventDefault();S.mode=S.mode==="move"?"select":"move";btns();return}
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"){ev.preventDefault();if(ev.shiftKey)redoFn();else undo();return}
    if(ev.key==="Escape"){S.sel={};draw();btns();return}
    if(ev.key.toLowerCase()==="l")document.getElementById("btnLayout").click();
    if(ev.key.toLowerCase()==="r")document.getElementById("btnShuffle").click();
  });
  window.addEventListener("resize",resize);

  function boot(){
    build();resize();
    var t=computeLayout(),id;
    for(id in t){var n=byId(Number(id));if(n){n.x=t[id].x;n.y=t[id].y}}
    scramble(1.05,20260903);
    fit(false);S.done=false;metrics(false);
    document.getElementById("mCount").textContent=S.nodes.length+" 节点 / "+S.edges.length+" 连线";
    btns();draw();
    setTimeout(hideHint,9000);
  }
  boot();
})();
</script>
</body></html>
